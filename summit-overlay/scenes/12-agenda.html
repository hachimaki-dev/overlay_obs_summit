<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummIT — Cronograma del Evento</title>
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/circuits.css">
  
  <style>
    body, html {
      background: radial-gradient(circle at center, var(--bg-purple-mid), var(--bg-purple-dark));
    }

    .scene-container {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 6vh 6vw;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
    }

    /* Header styling */
    .agenda-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4vh;
      border-bottom: 2px solid rgba(242, 169, 59, 0.3);
      padding-bottom: 2vh;
      z-index: 10;
    }

    .header-left h1 {
      font-size: 2.8vw;
      font-weight: 800;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 0.1vw;
    }

    .header-left p {
      font-size: 1.1vw;
      color: var(--text-light);
      opacity: 0.8;
      margin-top: 0.5vh;
    }

    .logo {
      font-size: 2.5vw;
      font-weight: 800;
      color: var(--text-white);
    }

    .logo span {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
      border-radius: 4px;
      padding: 0 0.4vw;
      color: var(--bg-purple-dark);
      margin-left: 0.2vw;
    }

    /* Timeline container */
    .timeline-container {
      position: relative;
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-left: 8vw;
      margin-bottom: 2vh;
      z-index: 10;
    }

    /* Vertical timeline bar */
    .timeline-line {
      position: absolute;
      left: 10vw;
      top: 2vh;
      bottom: 2vh;
      width: 4px;
      background: linear-gradient(to bottom, var(--gold-base), var(--magenta-base), var(--gold-base));
      box-shadow: 0 0 10px rgba(242, 169, 59, 0.3);
      border-radius: 2px;
    }

    /* Timeline Item row */
    .timeline-item {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 7.5vh; /* Fits 8 items comfortably on screen */
      opacity: 0;
      transform: translateX(-30px);
    }

    /* Time badge on the left side of the timeline */
    .time-badge {
      position: absolute;
      right: calc(100% - 8.5vw);
      width: 6vw;
      text-align: right;
      font-size: 1.3vw;
      font-weight: 800;
      color: var(--gold-bright);
      text-shadow: var(--glow-gold);
      padding-right: 1.5vw;
    }

    /* Circular indicator on the line */
    .timeline-dot {
      position: absolute;
      left: 9.6vw; /* Centered with 10vw timeline-line */
      width: 18px;
      height: 18px;
      background: var(--bg-purple-dark);
      border: 3px solid var(--gold-base);
      border-radius: 50%;
      z-index: 12;
      transition: transform 0.3s, border-color 0.3s;
      box-shadow: 0 0 10px rgba(242, 169, 59, 0.5);
    }

    /* Details card on the right side of the timeline */
    .activity-card {
      margin-left: 12vw;
      width: 65vw;
      background: rgba(61, 26, 92, 0.3);
      border: 1px solid rgba(242, 169, 59, 0.15);
      padding: 1.2vh 2vw;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(5px);
      transition: border-color 0.3s, background-color 0.3s, box-shadow 0.3s;
    }

    .activity-title {
      font-size: 1.25vw;
      font-weight: 700;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
    }

    .speaker-tag {
      font-size: 1vw;
      color: var(--gold-bright);
      background: rgba(242, 169, 59, 0.1);
      border: 1px solid rgba(242, 169, 59, 0.3);
      padding: 0.3vh 0.8vw;
      border-radius: 4px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4vw;
    }

    /* Active Session Highlight */
    .timeline-item.active .timeline-dot {
      border-color: #ff54b0;
      transform: scale(1.4);
      background: var(--text-white);
      box-shadow: 0 0 15px #ff54b0;
      animation: dotPulse 1.5s infinite ease-in-out;
    }

    .timeline-item.active .time-badge {
      color: #ff54b0;
      text-shadow: 0 0 10px rgba(255, 84, 176, 0.6);
    }

    .timeline-item.active .activity-card {
      background: rgba(185, 29, 115, 0.2);
      border: 2px solid var(--magenta-base);
      box-shadow: 0 0 25px rgba(185, 29, 115, 0.4);
    }

    .timeline-item.active .activity-title {
      color: var(--text-white);
      font-weight: 800;
    }

    .now-tag {
      font-size: 0.8vw;
      font-weight: 800;
      background: var(--magenta-base);
      color: var(--text-white);
      padding: 0.2vh 0.5vw;
      border-radius: 3px;
      text-transform: uppercase;
      margin-right: 0.8vw;
      box-shadow: var(--glow-magenta);
      animation: nowFlash 1s infinite alternate;
    }

    @keyframes dotPulse {
      0% { transform: scale(1.3); box-shadow: 0 0 10px #ff54b0; }
      50% { transform: scale(1.6); box-shadow: 0 0 25px #ff54b0; }
      100% { transform: scale(1.3); box-shadow: 0 0 10px #ff54b0; }
    }

    @keyframes nowFlash {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <!-- Animated background circuits -->
    <div class="circuits-layer"></div>

    <!-- Header -->
    <div class="agenda-header">
      <div class="header-left">
        <h1 class="title-glow">Cronograma</h1>
        <p>5ta Versión — Inteligencia Artificial Aplicada</p>
      </div>
      <div class="logo">Summ<span>IT</span></div>
    </div>

    <!-- Timeline Wrapper -->
    <div class="timeline-container">
      <div class="timeline-line"></div>
      <div id="timeline-list" style="display: contents;">
        <!-- Generated items go here -->
      </div>
    </div>
  </div>

  <script src="../assets/vendor/gsap.min.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/circuits-bg.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Initialize drawing circuits
      const circuits = new CircuitsBG('.circuits-layer', { theme: 'gold' });
      circuits.animateDraw();

      // Trigger random data flow flashes every few seconds
      setInterval(() => circuits.triggerDataFlow(), 3500);

      // 2. Load schedule data
      const schedule = await Utils.getSchedule();
      const timelineList = document.getElementById('timeline-list');
      
      // Determine active item from URL query parameter (?current=3)
      const currentParam = Utils.getQueryParam('current');
      const currentIndex = currentParam !== null ? parseInt(currentParam) : -1;

      if (schedule && schedule.length > 0) {
        schedule.forEach((item, index) => {
          const isActive = index === currentIndex;
          
          const timelineItem = document.createElement('div');
          timelineItem.className = `timeline-item ${isActive ? 'active' : ''}`;
          
          // Time badge
          const timeBadge = document.createElement('div');
          timeBadge.className = 'time-badge';
          timeBadge.textContent = item.time;
          
          // Dot
          const dot = document.createElement('div');
          dot.className = 'timeline-dot';
          
          // Card
          const card = document.createElement('div');
          card.className = 'activity-card';
          
          const titleContainer = document.createElement('div');
          titleContainer.style.display = 'flex';
          titleContainer.style.alignItems = 'center';
          
          if (isActive) {
            const nowTag = document.createElement('span');
            nowTag.className = 'now-tag';
            nowTag.textContent = 'Ahora';
            titleContainer.appendChild(nowTag);
          }
          
          const titleText = document.createElement('span');
          titleText.className = 'activity-title';
          titleText.textContent = item.activity;
          titleContainer.appendChild(titleText);
          
          card.appendChild(titleContainer);
          
          // Speaker tag if available
          if (item.speaker) {
            const speakerTag = document.createElement('div');
            speakerTag.className = 'speaker-tag';
            speakerTag.innerHTML = `
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-top:-1px">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>${item.speaker}</span>
            `;
            card.appendChild(speakerTag);
          }
          
          timelineItem.appendChild(timeBadge);
          timelineItem.appendChild(dot);
          timelineItem.appendChild(card);
          
          timelineList.appendChild(timelineItem);
        });

        // 3. Animate timeline rows with GSAP stagger
        gsap.to('.timeline-item', {
          opacity: 1,
          x: 0,
          duration: 0.8,
          ease: 'power3.out',
          stagger: 0.12,
          delay: 1.2 // Starts after circuits finish drawing
        });
      } else {
        timelineList.innerHTML = '<div style="font-size:1.5vw; color:var(--magenta-base); z-index:10;">Error al cargar el cronograma.</div>';
      }
    });
  </script>
</body>
</html>
