<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummIT — PiP Keynote Layout</title>
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/circuits.css">
  
  <style>
    body, html {
      background: transparent !important;
    }

    .scene-container {
      isolation: isolate;
    }

    /* Contenedor del fondo */
    .masked-background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, var(--bg-purple-mid), var(--bg-purple-dark));
      z-index: 1;
    }

    /* Recortes transparentes usando mix-blend-mode */
    .cutout {
      position: absolute;
      background: black;
      mix-blend-mode: destination-out;
      z-index: 5;
    }

    .slides-cutout {
      left: 22vw; top: 6vh; width: 73vw; height: 41.06vw; border-radius: 1vw;
    }

    .camera-cutout {
      left: 5vw; bottom: 8vh; width: 15vw; height: 15vw; border-radius: 50%;
    }

    /* Marcos y bordes luminosos que van encima de los huecos */
    .frame-overlay {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .slides-frame {
      left: 22vw;
      top: 6vh;
      width: 73vw;
      height: 41.06vw; /* Aspect ratio 16:9 */
      border: 3px solid var(--gold-bright);
      border-radius: 1vw;
      box-shadow: 0 0 20px rgba(242, 169, 59, 0.4), inset 0 0 15px rgba(242, 169, 59, 0.4);
    }

    .camera-frame {
      left: 5vw;
      bottom: 8vh;
      width: 15vw;
      height: 15vw;
      border: 3px solid var(--magenta-base);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(185, 29, 115, 0.5), inset 0 0 15px rgba(185, 29, 115, 0.5);
    }

    /* Elementos de la marca */
    .branding {
      position: absolute;
      top: 6vh;
      left: 3vw;
      width: 16vw;
      z-index: 10;
    }

    .logo-summ {
      font-size: 3vw;
      font-weight: 800;
      color: var(--text-white);
    }
    
    .logo-it-chip {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
      border-radius: 4px;
      padding: 0 0.6vw;
      color: var(--bg-purple-dark);
      font-weight: 800;
      font-size: 2.8vw;
      box-shadow: var(--glow-gold);
    }

    .lower-bar {
      position: absolute;
      bottom: 0;
      right: 5vw;
      background: rgba(61, 26, 92, 0.8);
      border: 1px solid rgba(242, 169, 59, 0.3);
      border-bottom: none;
      padding: 1vh 2vw;
      border-radius: 12px 12px 0 0;
      color: var(--text-light);
      font-weight: 600;
      font-size: 1.2vw;
      z-index: 10;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <div class="scene-container transparent-bg">
    
    <!-- El fondo (ahora sin máscara inline) -->
    <div class="masked-background">
      <div class="circuits-layer looping-bg"></div>
      <div class="particles-layer"></div>
    </div>

    <!-- Huecos que cortan la transparencia -->
    <div class="cutout slides-cutout"></div>
    <div class="cutout camera-cutout"></div>

    <!-- Marcos encima de los recortes para darles estilo -->
    <div class="frame-overlay slides-frame"></div>
    <div class="frame-overlay camera-frame"></div>

    <!-- Branding -->
    <div class="branding">
      <span class="logo-summ">Summ</span><span class="logo-it-chip">IT</span>
      <div style="color: var(--text-light); font-size: 0.9vw; margin-top: 0.5vh;">Inteligencia Artificial Aplicada</div>
    </div>

    <!-- Barra Inferior -->
    <div class="lower-bar">
      En Vivo • Duoc UC Sede Puerto Montt
    </div>

  </div>

  <script src="../assets/vendor/gsap.min.js"></script>
  <script src="../assets/js/circuits-bg.js"></script>
  <script>
    const circuits = new CircuitsBG('.circuits-layer', { theme: 'gold' });
    circuits.setStatic();
    setInterval(() => circuits.triggerDataFlow(), 2000);
  </script>
</body>
</html>
