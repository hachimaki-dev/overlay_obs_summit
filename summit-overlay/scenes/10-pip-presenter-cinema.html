<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummIT — PiP Presenter Layout (Cinematic)</title>
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/circuits.css">
  
  <style>
    body, html { background: transparent !important; }

    .scene-container {
      isolation: isolate;
    }

    .masked-background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--bg-purple-dark);
      z-index: 1;
    }

    .cutout {
      position: absolute;
      background: black;
      mix-blend-mode: destination-out;
      z-index: 5;
    }

    /* Cinematic Camera cutout (62vw width, 34.875vw height is 16:9) */
    .camera-cutout {
      left: 4vw;
      top: 10vh;
      width: 62vw;
      height: 34.875vw;
      border-radius: 1vw;
    }

    /* Cinematic Slides cutout (32vw width, 18vw height is 16:9) */
    .slides-cutout {
      left: 64vw;
      top: 48vh;
      width: 32vw;
      height: 18vw;
      border-radius: 1vw;
    }

    .frame-overlay {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      border-radius: 1vw;
    }

    /* Camera Frame upper-left */
    .camera-frame {
      left: 4vw;
      top: 10vh;
      width: 62vw;
      height: 34.875vw;
      border: 3px solid var(--gold-bright);
      box-shadow: 0 0 30px rgba(242, 169, 59, 0.45), inset 0 0 15px rgba(242, 169, 59, 0.3);
    }

    /* Slides Frame lower-right */
    .slides-frame {
      left: 64vw;
      top: 48vh;
      width: 32vw;
      height: 18vw;
      border: 3px solid var(--magenta-base);
      box-shadow: 0 0 30px rgba(185, 29, 115, 0.45), inset 0 0 15px rgba(185, 29, 115, 0.3);
    }

    /* Elegant label in the gap (top right) */
    .cinema-label {
      position: absolute;
      top: 15vh;
      left: 68vw;
      z-index: 10;
    }

    .logo-text {
      font-size: 2vw;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: 0.05vw;
    }

    .logo-text span {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
      border-radius: 4px;
      padding: 0 0.4vw;
      color: var(--bg-purple-dark);
      margin-left: 0.2vw;
    }

    .sub-text {
      font-size: 0.85vw;
      color: var(--text-light);
      opacity: 0.75;
      font-weight: 600;
      margin-top: 0.5vh;
      text-transform: uppercase;
      letter-spacing: 0.1vw;
    }

    /* Horizontal Speaker Info Bar */
    .speaker-info-bar {
      position: absolute;
      bottom: 5vh;
      left: 4vw;
      width: 92vw;
      height: 6.5vh;
      background: rgba(26, 10, 46, 0.85);
      border-left: 5px solid var(--magenta-base);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2vw;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 20;
      backdrop-filter: blur(10px);
      transform: translateY(30px);
      opacity: 0;
    }

    .sp-name {
      font-size: 1.1vw;
      color: var(--gold-bright);
    }

    .sp-talk {
      font-size: 1vw;
      color: var(--text-white);
      opacity: 0.9;
      font-weight: 600;
      max-width: 50vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="scene-container transparent-bg">
    <div class="masked-background">
      <div class="circuits-layer looping-bg"></div>
    </div>

    <!-- Transparent cutouts -->
    <div class="cutout camera-cutout"></div>
    <div class="cutout slides-cutout"></div>

    <!-- Glowing frames -->
    <div class="frame-overlay camera-frame"></div>
    <div class="frame-overlay slides-frame"></div>

    <!-- Minimal branding layout -->
    <div class="cinema-label">
      <div class="logo-text">Summ<span>IT</span></div>
      <div class="sub-text">Cinematic View / 5ta Versión</div>
    </div>

    <!-- Horizontal Speaker Info Bar -->
    <div class="speaker-info-bar" id="speaker-bar">
      <div class="sp-name" id="sp-name-txt">🎙️ Cargando...</div>
      <div class="sp-talk" id="sp-talk-txt">Charla del Evento</div>
    </div>
  </div>

  <script src="../assets/vendor/gsap.min.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/circuits-bg.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Initialize circuits background
      const circuits = new CircuitsBG('.circuits-layer', { theme: 'mixed' });
      circuits.setStatic();
      setInterval(() => circuits.triggerDataFlow(), 3000);

      // 2. Load speaker dynamic info
      const speakers = await Utils.getSpeakers();
      const index = parseInt(Utils.getQueryParam('index')) || 0;
      const showLabel = Utils.getQueryParam('show_label') !== 'false';

      const speakerBar = document.getElementById('speaker-bar');
      
      if (speakerBar) {
        if (!showLabel) {
          speakerBar.style.display = 'none';
        } else {
          if (speakers && speakers[index]) {
            const sp = speakers[index];
            document.getElementById('sp-name-txt').innerHTML = `🎙️ <strong>${sp.name}</strong> <span style="opacity:0.75; font-size:0.9em; margin-left:0.5vw;">(${sp.title})</span>`;
            document.getElementById('sp-talk-txt').textContent = `Tema: ${sp.talk}`;
          } else {
            document.getElementById('sp-name-txt').textContent = `🎙️ Expositor`;
            document.getElementById('sp-talk-txt').textContent = `Charla Informativa`;
          }
          
          // Animate banner entry
          gsap.to(speakerBar, {
            y: 0,
            opacity: 1,
            duration: 0.8,
            ease: 'back.out(1.2)',
            delay: 0.5
          });
        }
      }
    });
  </script>
</body>
</html>
